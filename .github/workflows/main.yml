name: Build Nuitka EXE for Windows and Linux AppImage

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install nuitka==4.3.5
          python -m pip check

      - name: Verify project structure
        run: |
          if (-Not (Test-Path "dnaencoder_GUI.py")) { Write-Error "dnaencoder_GUI.py not found"; exit 1 }

      - name: Precompile Python files
        run: python -m compileall .

      - name: Build EXE with Nuitka
        shell: cmd
        run: python -m nuitka dnaencoder_GUI.py --standalone --onefile --follow-imports --enable-plugin=pyside6 --output-dir=build --windows-console-mode=disable --assume-yes-for-downloads --output-filename=DNAtoPolypeptideMessageEncoder.exe

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DNAtoPolypeptideMessageEncoder-Windows
          path: build/DNAtoPolypeptideMessageEncoder.exe


  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf desktop-file-utils libgirepository1.0-dev \
            libfuse2 imagemagick libfreetype6-dev libpng-dev \
            libqt6core6 libqt6gui6 libqt6widgets6

      - name: Install Python packages
        run: |
          python -m pip install -r requirements.txt
          python -m pip install nuitka==4.3.5
          python -m pip check
          python -c "import nltk; nltk.download('words', download_dir='nltk_data', quiet=True)"

      - name: Build binary with Nuitka
        run: |
          python -m nuitka dnaencoder_GUI.py \
            --include-data-dir=nltk_data=nltk_data \
            --standalone \
            --onefile \
            --follow-imports \
            --enable-plugin=pyside6 \
            --output-dir=build \
            --assume-yes-for-downloads \
            --include-module=appdirs,nltk,tenacity \
            --output-filename=DNAtoPolypeptideMessageEncoder.bin

      - name: Prepare AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          cp build/DNAtoPolypeptideMessageEncoder.bin AppDir/usr/bin/DNAtoPolypeptideMessageEncoder
          chmod +x AppDir/usr/bin/DNAtoPolypeptideMessageEncoder
          cp -r nltk_data AppDir/nltk_data

          # Create AppRun
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/DNAtoPolypeptideMessageEncoder" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Create .desktop file
          cat > AppDir/DNAtoPolypeptideMessageEncoder.desktop << EOF
          [Desktop Entry]
          Name=DNA to Polypeptide Encoder
          Exec=DNAtoPolypeptideMessageEncoder
          Icon=DNAtoPolypeptideMessageEncoder
          Type=Application
          Categories=Utility;
          EOF

          # Add icon
          cp assets/DNAtoPolypeptideMessageEncoder.png AppDir/DNAtoPolypeptideMessageEncoder.png

      - name: Install verified AppImage packaging tools
        run: |
          set -euo pipefail

          TOOL_VERSION="1.9.1"
          TOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"

          RUNTIME_VERSION="20251108"
          RUNTIME_SHA256="2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"

          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/${TOOL_VERSION}/appimagetool-x86_64.AppImage" \
            -o /tmp/appimagetool.AppImage

          printf '%s  %s\n' "$TOOL_SHA256" /tmp/appimagetool.AppImage | sha256sum -c -

          curl --fail --location --retry 3 \
            "https://github.com/AppImage/type2-runtime/releases/download/${RUNTIME_VERSION}/runtime-x86_64" \
            -o /tmp/appimage-runtime-x86_64

          printf '%s  %s\n' "$RUNTIME_SHA256" /tmp/appimage-runtime-x86_64 | sha256sum -c -

          chmod +x /tmp/appimagetool.AppImage
          (cd /tmp && /tmp/appimagetool.AppImage --appimage-extract >/dev/null)

          sudo install -m 0755 /tmp/squashfs-root/usr/bin/appimagetool /usr/local/bin/appimagetool

          echo "APPIMAGE_RUNTIME_FILE=/tmp/appimage-runtime-x86_64" >> "$GITHUB_ENV"

      - name: Build AppImage
        run: |
          set -euo pipefail

          : "${APPIMAGE_RUNTIME_FILE:?Verified runtime is required}"
          test -s "$APPIMAGE_RUNTIME_FILE"

          ARCH=x86_64 appimagetool \
            --runtime-file "$APPIMAGE_RUNTIME_FILE" \
            AppDir DNAtoPolypeptideMessageEncoder-x86_64.AppImage

          test -s DNAtoPolypeptideMessageEncoder-x86_64.AppImage
          chmod +x DNAtoPolypeptideMessageEncoder-x86_64.AppImage

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DNAtoPolypeptideMessageEncoder-Linux
          path: DNAtoPolypeptideMessageEncoder-x86_64.AppImage

  publish-release:
    if: github.event_name == 'release'
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DNAtoPolypeptideMessageEncoder-Windows
          path: release/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DNAtoPolypeptideMessageEncoder-Linux
          path: release/linux

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/windows/DNAtoPolypeptideMessageEncoder.exe
            release/linux/DNAtoPolypeptideMessageEncoder-x86_64.AppImage
